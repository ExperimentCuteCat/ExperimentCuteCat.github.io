<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment Cute Cat - Result Meme Cat 🗣️</title>

<script>
if(localStorage.getItem("darkMode") === "true"){
    document.addEventListener("DOMContentLoaded", function(){
        document.body.classList.add("dark");
    });
}
</script>

<style>
:root {
    --pink: #febfd6;
    --neon-pink: #ff2ea6;
}

* {
    transition: background 0.4s ease, color 0.4s ease, border 0.4s ease, box-shadow 0.4s ease;
}

body {
    font-family: Arial, sans-serif;
    line-height: 1.6;
    background: #fff0f6;
    color: #333;
    padding: 20px;
    max-width: 800px;
    margin: auto;
}

h1, h2 {
    color: var(--pink);
}

.highlight {
    color: var(--pink);
    font-weight: bold;
}

body.dark {
    background: radial-gradient(circle at 20% 20%, rgba(255,46,166,0.15), transparent 40%),
                linear-gradient(-45deg, #1a1a1a, #2a1f2f, #1a1a1a);
    color: #f5f5f5;
}

body.dark h1, 
body.dark h2 {
    color: var(--neon-pink);
    text-shadow: 0 0 15px var(--neon-pink);
}

body.dark .highlight {
    color: var(--neon-pink);
}

body.dark ul li strong {
    color: var(--neon-pink);
}

button {
    background: var(--pink);
    color: #333;
    border: none;
    padding: 12px 24px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.3s ease;
    margin-top: 20px;
    display: block;
    margin-left: auto;
    margin-right: auto;
}

button:hover {
    background: var(--neon-pink);
    color: #fff;
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(255, 46, 166, 0.3);
}

body.dark button {
    background: var(--neon-pink);
    color: #f5f5f5;
}

body.dark button:hover {
    background: #fff;
    color: var(--neon-pink);
    box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
}

#countdown {
    text-align: center;
    margin-top: 20px;
    font-size: 18px;
    color: var(--pink);
    transition: all 0.3s ease;
}

#countdown.exciting {
    font-size: 48px;
    color: var(--neon-pink);
    animation: pulse 0.5s infinite;
    text-shadow: 0 0 15px var(--neon-pink);
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

.floating-hearts {
    pointer-events: none;
}

.floating-hearts span {
    position: fixed;
    bottom: -10vh;
    font-size: 22px;
    opacity: 0.4;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    from { transform: translateY(0); }
    to { transform: translateY(-120vh); }
}
</style>
</head>

<body>
    <h1>Experiment Cute Cat – Result E</h1>

    <p>Congratulations! Based on your answers, your result is <span class="highlight">Meme Cat 🗣️</span>. Enjoy your personalized cute video experience!</p>

    <button onclick="proceedToVideo()">Proceed to Video</button>

    <div id="countdown" style="text-align: center; margin-top: 20px; font-size: 18px; color: var(--pink);"></div>

    <div class="floating-hearts"></div>

    <script>
    function proceedToVideo() {
        document.querySelector('button').style.display = 'none';
        const countdownEl = document.getElementById('countdown');
        let count = 10;
        countdownEl.innerText = `Video loading in ${count} seconds...`;

        const interval = setInterval(() => {
            count--;
            if (count > 3) {
                countdownEl.innerText = `Video loading in ${count} seconds...`;
            } else if (count > 0) {
                countdownEl.classList.add('exciting');
                countdownEl.innerText = count;
            } else {
                clearInterval(interval);
                const iframeHTML = '<div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%;"><iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" src="https://www.youtube.com/embed/J---aiyznGQ" title="Cute Cat Video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>';
                document.getElementById('videoContainer').innerHTML = iframeHTML;
                countdownEl.style.display = 'none';
            }
        }, 1000);
    }

    function createHearts(){
        const container = document.querySelector(".floating-hearts");
        container.innerHTML = ""; // clear old ones

        for(let i=0;i<15;i++){
            const heart = document.createElement("span");
            heart.innerText = ["💖","✨","🐾"][Math.floor(Math.random()*3)];
            heart.style.left = Math.random()*100 + "vw";
            heart.style.animationDuration = (15 + Math.random()*10) + "s";
            heart.style.animationDelay = Math.random()*5 + "s";
            container.appendChild(heart);
        }
    }

    createHearts();
    </script>
